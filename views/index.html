<!doctype html>
<html>
  <head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>
      <div id="expense-section">
        <div class="expense-card expense-card-form">
          <h2>Add Expense</h2>

          <form id="expense-form">
            <input
              type="number"
              id="amount"
              placeholder="Amount"
              min="0"
              step="0.01"
              required
            />

            <input
              type="text"
              id="description"
              placeholder="Description"
              required
            />

            <input type="date" id="date" required />

            <div class="category-container">
              <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
              </select>

              <button type="button" id="ai-category-btn">
                Suggest Category
              </button>
            </div>

            <button type="submit">Add Expense</button>
          </form>
        </div>

        <div class="expense-card expense-table-card">
          <h2 class="section-title">Expense History</h2>

          <div class="report-tabs">
            <button class="tab-btn active" data-filter="monthly">
              Monthly
            </button>

            <button class="tab-btn" data-filter="weekly">Weekly</button>

            <button class="tab-btn" data-filter="daily">Daily</button>
          </div>

          <table id="expense-table">
            <thead>
              <tr>
                <th>Amount</th>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="expense-list"></tbody>
          </table>

          <div class="pagination">
            <button id="prev-page">Previous</button>

            <span id="page-info"> Page 1 </span>

            <button id="next-page">Next</button>

            <div class="page-count">
              <span>Expenses per page: </span>
              <select name="row-count" id="row-count">
                <option value="2">2</option>
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div id="leaderboard-section">
        <h2 class="section-title">Leaderboard</h2>

        <button id="show-leaderboard">Show Leaderboard</button>

        <ul id="leaderboard-list"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"></script>
    <script src="/js/script.js"></script>
  </body>
</html>
