<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-5">

      <h1 class="main-heading">
        Expense Tracker
      </h1>

      <p class="sub-heading">
        Track and manage your daily expenses easily
      </p>
    </div>

    <div class="card form-card shadow-lg border-0">
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">
              Amount
            </label>
            <input
              type="number"
              id="amount"
              class="form-control custom-input"
              placeholder="Enter amount"
            >
          </div>
          <div class="col-md-4">
            <label class="form-label">
              Description
            </label>

            <input
              type="text"
              id="description"
              class="form-control custom-input"
              placeholder="Expense description"
            >
          </div>

          <div class="col-md-3">
            <label class="form-label">
              Category
            </label>
            <select id="category" class="form-select custom-input">
              <option value="Movie">Movie</option>
              <option value="Fuel">Fuel</option>
              <option value="Food">Food</option>
              <option value="Shopping">Shopping</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-2 d-grid align-items-end">
            <button class="btn add-btn" onclick="addExpense()">
              Add Expense
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card expense-card shadow-lg border-0 mt-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="expense-title">
            Expense History
          </h4>
        </div>
        <ul id="expenseList" class="list-group list-group-flush"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"></script>
  <script src="/js/script.js"></script>

</body>

</html>
